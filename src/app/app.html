<router-outlet />

<header class="hero">
  <div class="hero__nav">
    <img src="/assets/images/Logo.svg" alt="PollApp Logo" class="hero__logo" />
  </div>

  <div class="hero__content">
    <div class="hero__text">
      <h1 class="hero__title">Collect Feedback, Unlock Ideas</h1>

      <div class="hero__image-wrapper hero__image-wrapper--mobile">
        <img src="/assets/images/Hero_image.svg" alt="Illustration survey" class="hero__img" />
      </div>

      <p class="hero__description">
        Create and share surveys in minutes – from team events to workplace culture. Collect opinions, engage your
        audience, and turn feedback into action.
      </p>

      <button type="button" class="btn-primary hero__btn">
        New survey
      </button>
    </div>

    <div class="hero__image-wrapper hero__image-wrapper--desktop">
      <img src="/assets/images/Hero_image.svg" alt="Illustration survey" class="hero__img hero__img--default" />
      <img src="/assets/images/Hero_image_hover.svg" alt="Illustration survey hover"
        class="hero__img hero__img--hover" />
    </div>
  </div>
</header>

<section class="ending-soon">
  <div class="ending-soon__header">
    <h2 class="ending-soon__title">Your surveys</h2>
    <p class="ending-soon__subtitle">Ending soon surveys</p>
  </div>

  <div class="ending-soon__cards-container">
    <button type="button" class="survey-card">
      <span class="survey-card__category">survey category</span>
      <span class="survey-card__title">survey title</span>
      <span class="survey-card__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card">
      <span class="survey-card__category">survey category</span>
      <span class="survey-card__title">survey title</span>
      <span class="survey-card__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card">
      <span class="survey-card__category">survey category</span>
      <span class="survey-card__title">survey title</span>
      <span class="survey-card__expiry">Ends in</span>
    </button>
  </div>
</section>

<section class="all-surveys">
  <div class="all-surveys__toolbar">
    <div class="all-surveys__status-filters">
      <button type="button" class="btn-filter active">Active survey</button>
      <button type="button" class="btn-filter">Past survey</button>
    </div>

    <div class="all-surveys__sort">
      <button type="button" class="all-surveys__custom-select" [class.is-open]="isOpen()"
        [class.has-selection]="selectedCategory() !== ''" (click)="toggleDropdown()">

        <span class="all-surveys__trigger-text">Sort by categories</span>

        @if (isOpen()) {
        <ul class="all-surveys__dropdown-list">
          @for (category of categories; track category) {
          <li class="all-surveys__dropdown-item" (click)="selectCategory(category, $event)">
            {{ category }}
          </li>
          }
        </ul>
        }
      </button>

      <div class="all-surveys__selected-category">
        {{ selectedCategory() }}
      </div>
    </div>
  </div>

  <div class="all-surveys__grid-container">
    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>

    <button type="button" class="survey-card-dark">
      <span class="survey-card-dark__category">survey category</span>
      <span class="survey-card-dark__title">survey title</span>
      <span class="survey-card-dark__expiry">Ends in</span>
    </button>
  </div>
</section>
